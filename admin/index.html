<!doctype html>
<html lang="ckb" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>VibeCheck Admin</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;600;800&family=DM+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--coral:#E2573B;--ink:#1E1630;--bg:#F6F3F8;--card:#fff;--line:#E0D8E8;--muted:#6C6280;--ok:#1F8A5B;--err:#C0392B;--warn:#9a6a0e}
@media (prefers-color-scheme:dark){:root{--ink:#F2ECFA;--bg:#130E1E;--card:#1D1630;--line:#33294A;--muted:#A79BBD;--coral:#FF7A5C;--warn:#E3B04B}}
*{box-sizing:border-box}
html,body{overflow-x:hidden}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans Arabic","DM Sans",system-ui,sans-serif;font-size:16px;line-height:1.5}
body.en{font-family:"DM Sans","Noto Sans Arabic",system-ui,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.brand{font-family:"DM Sans",sans-serif;font-weight:800;font-size:20px;direction:ltr;display:flex;align-items:center;gap:6px}
.brand b{color:var(--coral)}
.sv{font-weight:600;color:var(--muted);font-size:15px}
.grow{flex:1;min-width:0}
@media (max-width:420px){.sv{display:none}header .small{padding:6px 10px;font-size:13px;min-height:38px}}
main{max-width:760px;margin:0 auto;padding:16px 16px 80px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
h1{font-size:22px;margin:4px 0 12px}
h2{font-size:16px;margin:0 0 10px}
label{display:block;font-weight:600;margin:10px 0 6px}
.hint{color:var(--muted);font-size:13.5px;margin:2px 0 8px}
input[type=text],input[type=email],input[type=password],input[type=search],input[type=date],select,textarea{width:100%;font:inherit;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink)}
input:focus,select:focus{outline:2px solid var(--coral);border-color:transparent}
.ltr{direction:ltr;text-align:left}
button{font:inherit;font-weight:800;border:0;border-radius:14px;padding:14px 16px;min-height:48px;cursor:pointer}
.primary{background:var(--coral);color:#fff}
.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.danger{background:transparent;color:var(--err);border:1px solid #C0392B55}
.small{padding:7px 12px;min-height:38px;font-size:14px;border-radius:12px}
button:disabled{opacity:.5}
.tabs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px;margin-bottom:14px}
.tabs button{background:transparent;color:var(--ink);padding:10px 2px;min-height:44px;font-size:13.5px;position:relative}
.tabs button.on{background:var(--coral);color:#fff}
.tabs .n{display:inline-block;min-width:18px;padding:0 5px;border-radius:9px;background:var(--err);color:#fff;font-size:11px;line-height:18px;margin-inline-start:4px}
.row{display:flex;gap:12px;align-items:flex-start}
.logo{width:46px;height:46px;border-radius:12px;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;background:var(--muted);overflow:hidden}
.logo img{width:100%;height:100%;object-fit:cover}
.who{color:var(--muted);font-size:13.5px}
.diff{margin:8px 0 0;padding:0;list-style:none;font-size:14px}
.diff li{padding:3px 0;border-top:1px dashed var(--line)}
.diff .k{color:var(--muted);font-weight:600}
.diff del{color:var(--err);text-decoration:line-through;opacity:.8}
.diff ins{color:var(--ok);text-decoration:none;font-weight:600}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12.5px;font-weight:700}
.pill.ok{background:#1F8A5B22;color:var(--ok)}.pill.bad{background:#C0392B22;color:var(--err)}.pill.wait{background:#C98A1422;color:var(--warn)}.pill.mut{background:#6C628022;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.ph{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.ph img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;background:var(--line);cursor:zoom-in}
.ph .t{padding:8px 10px;font-size:13px}
.ph .t b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ph.hid img{opacity:.35}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 12px;font-weight:700;min-height:0;font-size:13.5px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.msg{padding:12px 14px;border-radius:12px;margin:10px 0;font-weight:600}
.msg.err{background:#C0392B1a;color:var(--err)}.msg.ok{background:#1F8A5B1a;color:var(--ok)}
.stat{font-size:24px;font-weight:800;line-height:1.2}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:8px}
.stats div{background:var(--bg);border-radius:12px;padding:8px 10px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:520px){.two{grid-template-columns:1fr}}
.viewer{position:fixed;inset:0;background:#000d;z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.viewer img{max-width:100%;max-height:100%;border-radius:8px}
[hidden]{display:none!important}
</style>
</head>
<body>
<header>
  <div class="brand"><svg width="22" height="22" viewBox="0 0 100 100" aria-hidden="true"><path d="M20 50 40 70 66 37" fill="none" stroke="currentColor" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/><circle cx="78" cy="23" r="10" fill="#E2573B"/></svg><span>Vibe<b>Check</b></span> <span class="sv">Admin</span></div>
  <div class="grow"></div>
  <button class="ghost small" id="langBtn" type="button">English</button>
  <button class="ghost small" id="outBtn" type="button" hidden data-t="logout"></button>
</header>

<main>
  <section id="login" hidden>
    <h1 data-t="loginTitle"></h1>
    <div class="card">
      <form id="loginForm">
        <label for="email" data-t="email"></label>
        <input id="email" type="email" class="ltr" autocomplete="username" required>
        <label for="pass" data-t="password"></label>
        <input id="pass" type="password" class="ltr" autocomplete="current-password" required>
        <div id="loginMsg"></div>
        <button class="primary" type="submit" style="margin-top:14px;width:100%" data-t="signIn"></button>
      </form>
    </div>
  </section>

  <section id="app" hidden>
    <div id="setupMsg"></div>
    <div class="tabs" role="tablist">
      <button type="button" data-tab="changes" class="on"><span data-t="tabChanges"></span></button>
      <button type="button" data-tab="photos"><span data-t="tabPhotos"></span></button>
      <button type="button" data-tab="places"><span data-t="tabPlaces"></span><span class="n" id="pendN" hidden></span></button>
      <button type="button" data-tab="payments"><span data-t="tabPayments"></span><span class="n" id="payN" hidden></span></button>
      <button type="button" data-tab="support"><span data-t="tabSupport"></span><span class="n" id="supN" hidden></span></button>
      <button type="button" data-tab="ads"><span data-t="tabAds"></span><span class="n" id="adN" hidden></span></button>
      <button type="button" data-tab="codes"><span data-t="tabCodes"></span></button>
      <button type="button" data-tab="claims"><span data-t="tabClaims"></span><span class="n" id="claimN" hidden></span></button>
      <button type="button" data-tab="team"><span data-t="tabTeam"></span></button>
      <button type="button" data-tab="settings"><span data-t="tabSettings"></span></button>
    </div>
    <div id="msg"></div>

    <div id="changesBox">
      <div class="chips" id="whoF"></div>
      <div id="changesList"></div>
      <button class="ghost" type="button" id="moreChanges" style="width:100%" data-t="showMore" hidden></button>
    </div>

    <div id="photosBox" hidden>
      <div class="chips" id="photoF"></div>
      <div class="grid" id="photosList"></div>
      <button class="ghost" type="button" id="morePhotos" style="width:100%;margin-top:10px" data-t="showMore" hidden></button>
    </div>

    <div id="placesBox" hidden>
      <div class="chips" id="placeF"></div>
      <input id="q" type="search" data-ph="searchPh" style="margin-bottom:10px">
      <div id="placesList"></div>
    </div>

    <div id="paymentsBox" hidden>
      <div class="card">
        <h2 data-t="payWhere"></h2>
        <p class="hint" data-t="payWhereHint"></p>
        <label for="fibNumber" data-t="fibNumber"></label><input id="fibNumber" type="text" inputmode="tel" class="ltr" placeholder="0750 123 4567">
        <label for="fibName" data-t="fibName" style="margin-top:8px"></label><input id="fibName" type="text" class="ltr">
        <button class="primary" type="button" id="savePayWhere" style="width:100%;margin-top:12px" data-t="save"></button>
      </div>
      <div class="chips" id="payF"></div>
      <p class="hint" id="payTotal"></p>
      <div id="payList"></div>
    </div>

    <div id="supportBox" hidden>
      <div class="chips" id="supF"></div>
      <div id="supList"></div>
    </div>

    <div id="adsBox" hidden>
      <div class="chips" id="adF"></div>
      <div id="adList"></div>
    </div>

    <div id="codesBox" hidden>
      <div class="card">
        <h2 data-t="makeCodes"></h2>
        <p class="hint" data-t="makeCodesHint"></p>
        <div class="two">
          <div><label for="codeKind" data-t="codeKind"></label><select id="codeKind"><option value="pro">Pro (venue)</option><option value="premium">Premium (venue)</option><option value="golden">Golden VIP</option><option value="diamond">Diamond VIP</option><option value="plus">Plus</option></select></div>
          <div><label for="codeDays" data-t="codeDays"></label><input id="codeDays" type="text" inputmode="numeric" class="ltr" value="30"></div>
        </div>
        <label for="codeCount" data-t="codeCount" style="margin-top:8px"></label><input id="codeCount" type="text" inputmode="numeric" class="ltr" value="1">
        <label for="codeNote" data-t="codeNote" style="margin-top:8px"></label><input id="codeNote" type="text">
        <button class="primary" type="button" id="makeCodesBtn" style="width:100%;margin-top:12px" data-t="makeCodesBtn"></button>
        <pre id="newCodes" class="ltr" style="white-space:pre-wrap;font-size:16px;font-weight:700" hidden></pre>
      </div>
      <div id="codeList"></div>
    </div>

    <div id="claimsBox" hidden>
      <p class="hint" data-t="claimsHint"></p>
      <div id="claimsList"></div>
      <h2 style="margin:22px 4px 8px" data-t="ownersTitle"></h2>
      <div id="ownersList"></div>
    </div>

    <div id="teamBox" hidden>
      <div id="teamList"></div>
      <div class="card">
        <h2 data-t="addMember"></h2>
        <p class="hint" data-t="addMemberHint"></p>
        <div class="two">
          <div><label for="mEmail" data-t="email"></label><input id="mEmail" type="email" class="ltr"></div>
          <div><label for="mName" data-t="name"></label><input id="mName" type="text" maxlength="40"></div>
        </div>
        <label for="mRole" data-t="role"></label>
        <select id="mRole"><option value="surveyor" data-t="surveyor"></option><option value="admin" data-t="admin"></option></select>
        <button class="primary" type="button" id="addBtn" style="width:100%;margin-top:12px" data-t="add"></button>
      </div>
    </div>

    <div id="settingsBox" hidden>
      <div class="card">
        <h2 data-t="signinTitle"></h2>
        <p class="hint" data-t="signinHint"></p>
        <label style="display:flex;gap:10px;align-items:center;font-weight:700"><input type="checkbox" id="accOnline" style="width:22px;height:22px;accent-color:var(--coral)"> <span data-t="signinOn"></span></label>
      </div>
      <div class="card">
        <h2 data-t="launchTitle"></h2>
        <p class="hint" data-t="launchHint"></p>
        <input id="launchDate" type="date" class="ltr">
        <p class="hint" id="freeEnd" style="margin-top:8px"></p>
        <button class="primary" type="button" id="saveLaunch" style="width:100%;margin-top:6px" data-t="save"></button>
      </div>
      <div class="card">
        <h2 data-t="giftsTitle"></h2>
        <div class="two">
          <div><label for="gGold" data-t="golden"></label><input id="gGold" type="text" inputmode="numeric" class="ltr"></div>
          <div><label for="gDia" data-t="diamond"></label><input id="gDia" type="text" inputmode="numeric" class="ltr"></div>
        </div>
        <button class="primary" type="button" id="saveGifts" style="width:100%;margin-top:12px" data-t="save"></button>
      </div>
      <div class="card">
        <h2 data-t="linksTitle"></h2>
        <p><a href="../" data-t="surveyLink"></a></p>
      </div>
    </div>
  </section>
</main>
<div class="viewer" id="viewer" hidden><img alt=""></div>

const FIELDS = ["name", "name_ckb", "name_ar", "name_en", "category", "phone", "instagram", "opening_hours", "website", "address", "logo_path", "hidden", "status"];
function dist(a, b) { const r = 6371000, p1 = a.lat * Math.PI / 180, p2 = b.lat * Math.PI / 180, dp = p2 - p1, dl = (b.lng - a.lng) * Math.PI / 180; const h = Math.sin(dp / 2) ** 2 + Math.cos(p1) * Math.cos(p2) * Math.sin(dl / 2) ** 2; return 2 * r * Math.asin(Math.min(1, Math.sqrt(h))); }
async function loadChanges(more) {
  let q = sb.from("venue_edits").select("id,venue_id,editor_id,action,before,after,created_at").order("id", { ascending: false }).limit(40);
  if (more && edits.length) q = q.lt("id", edits[edits.length - 1].id);

  const { data, error } = await q;
  if (error) return showMsg(t("failed"), "err");

}

function fmtVal(k, v) {
  if (v === null || v === undefined || v === "") return t("empty");
  if (k === "category") return catLabel(v);
  if (k === "hidden") return v ? "✓" : "✗";
  if (k === "logo_path") return t("newLogo");

}

  const box = $("#changesList"); box.innerHTML = "";
  if (!edits.length) { box.innerHTML = `<p class="hint">${t("nothing")}</p>`; $("#moreChanges").hidden = true; return; }

    const v = venueCache[e.venue_id], a = e.after || {}, b = e.before || {};

    let diff = "";
    if (e.action === "update") {
      for (const k of FIELDS) if (JSON.stringify(a[k] ?? null) !== JSON.stringify(b[k] ?? null))
        diff += `<li><span class="k">${esc(t("k_" + k))}:</span> <del>${esc(fmtVal(k, b[k]))}</del> → <ins>${esc(fmtVal(k, a[k]))}</ins></li>`;
      if (b.lat != null && (a.lat !== b.lat || a.lng !== b.lng)) diff += `<li>${esc(t("moved", { m: Math.round(dist(b, a)) }))}</li>`;
    }
    const undone = edits.some(x => x.id > e.id && x.venue_id === e.venue_id && x.editor_id === me.id && x.action === "update" && JSON.stringify(pick(x.after)) === JSON.stringify(pick(e.before)));

      <b>${esc(a.name || v?.name || "#" + e.venue_id)}</b> ${v?.hidden ? `<span class="pill bad">${t("hidden")}</span>` : ""}
      <div class="who">${esc(nameOf(e.editor_id))} · ${esc(e.action === "insert" ? t("added") : t("edited"))} · ${esc(when(e.created_at))}</div>

      <div class="acts">${e.before || e.action === "insert" ? `<button class="ghost small" type="button" data-undo="${e.id}">${t("undo")}</button>` : ""}${undone ? `<span class="pill ok">${t("undone")}</span>` : ""}</div>
    </div></div>`;
    box.appendChild(card);
  }
  box.querySelectorAll("[data-undo]").forEach(btn => btn.onclick = async () => {
    const e = edits.find(x => x.id == btn.dataset.undo);
    if (!confirm(e.action === "insert" ? t("undoAskNew") : t("undoAsk"))) return;

    const d = document.createElement("div"); d.className = "card";
    d.innerHTML = `<div class="grow"><b>${esc(c.venue_name)}</b>
      <div class="who">${esc(c.owner_name || "?")} · <a class="ltr" href="tel:${esc(c.contact_phone)}">${esc(c.contact_phone)}</a> · ${esc(when(c.created_at))}</div>
      <div class="who">${esc(t("claimLic", { x: c.licence_number }))}</div>
      <div class="grid" style="margin-top:8px" data-docs></div>
      <div class="acts"><button class="primary small" type="button" data-ok>${t("approve")}</button>
      <button class="danger small" type="button" data-no>${t("reject")}</button></div></div>`;
    const docs = d.querySelector("[data-docs]");
    for (const path of c.documents || []) {
      sb.storage.from("claims").createSignedUrl(path, 900).then(({ data: u }) => {
        if (!u) return;
        const a = document.createElement("a"); a.href = u.signedUrl; a.target = "_blank"; a.rel = "noopener";
        a.innerHTML = /\.pdf$/i.test(path) ? "PDF" : `<img src="${u.signedUrl}" alt="" style="width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px">`;
        docs.appendChild(a);
      });
    }
    const decide = async (btn, ok, reason) => {
      btn.disabled = true;
      const { error } = await sb.rpc("admin_decide_claim", { p_claim: c.id, p_approve: ok, p_reason: reason || null });
      if (error) { btn.disabled = false; return showMsg(/already_owned/.test(error.message) ? t("alreadyOwned") : t("failed"), "err"); }
      showMsg(t("saved")); loadClaims();
    };
    d.querySelector("[data-ok]").onclick = ev => { if (confirm(t("approveAsk", { who: c.owner_name || "?", place: c.venue_name }))) decide(ev.target, true); };
    d.querySelector("[data-no]").onclick = ev => { const r = prompt(t("rejectWhy")); if (r !== null) decide(ev.target, false, r.trim()); };
    box.appendChild(d);
  }
  loadOwners();
}

// ---------- support chats ----------
let supF = "open", supOpenId = null;
async function loadSupportCount() {
  const { data } = await sb.rpc("admin_support_threads", { p_status: "open" });
  const n = (Array.isArray(data) ? data : []).filter(x => x.team_unread > 0).length;
  $("#supN").hidden = !n; $("#supN").textContent = n || "";
}
async function loadSupport(keepOpen) {
  chips("#supF", [["open", t("fOpen")], ["solved", t("fSolved")], ["all", t("fAll")]], supF, k => { supF = k; supOpenId = null; loadSupport(); });
  const box = $("#supList");
  const { data, error } = await sb.rpc("admin_support_threads", { p_status: supF });
  if (error) { box.innerHTML = `<p class="hint">${esc(/function|schema cache/.test(error.message) ? t("need0013") : t("failed"))}</p>`; return; }
  const list = Array.isArray(data) ? data : [];
  if (supF === "open") { const n = list.filter(x => x.team_unread > 0).length; $("#supN").hidden = !n; $("#supN").textContent = n || ""; }
  if (keepOpen && document.activeElement && document.activeElement.closest && document.activeElement.closest("#supList")) return; // don't disturb typing
  box.innerHTML = list.length ? "" : `<p class="hint">${t("nothing")}</p>`;
  for (const th of list) {
    const d = document.createElement("div"); d.className = "card";
    d.innerHTML = `<div class="grow" style="cursor:pointer" data-head>
        <b>${esc(th.display_name || "?")}</b>${th.username ? " · @" + esc(th.username) : ""} ${th.team_unread > 0 ? `<span class="pill wait">${th.team_unread}</span>` : ""} ${th.is_owner ? `<span class="pill mut">${t("owner")}</span>` : ""}
        <div class="who">${esc(t("t_" + th.topic))} · ${esc(when(th.last_at))}${th.phone ? ` · <a class="ltr" href="tel:${esc(th.phone)}">${esc(th.phone)}</a>` : ""}</div>
        <div class="who" style="margin-top:4px">${th.last_from_team ? "↪ " : ""}${esc((th.last_body || "").slice(0, 140))}</div>
      </div><div data-body hidden></div>`;
    const body = d.querySelector("[data-body]");
    const open = async () => {
      supOpenId = th.id; body.hidden = false; body.innerHTML = `<p class="hint">…</p>`;
      const { data: msgs } = await sb.from("support_messages").select("id, from_team, body, created_at").eq("thread_id", th.id).order("id", { ascending: true }).limit(500);
      body.innerHTML = `<div style="display:flex;flex-direction:column;gap:6px;margin:12px 0;max-height:420px;overflow:auto" data-msgs>${(msgs || []).map(m => `
          <div style="align-self:${m.from_team ? "flex-end" : "flex-start"};max-width:85%;padding:8px 12px;border-radius:14px;background:${m.from_team ? "var(--coral)" : "var(--soft, #EFEAF4)"};color:${m.from_team ? "#fff" : "inherit"};white-space:pre-wrap">${esc(m.body)}<div style="font-size:11px;opacity:.7;margin-top:2px">${m.from_team ? esc(t("team")) + " · " : ""}${esc(when(m.created_at))}</div></div>`).join("")}</div>
        <textarea rows="3" data-reply placeholder="${esc(t("replyPh"))}" style="width:100%;box-sizing:border-box"></textarea>
        <div class="acts"><button class="primary small" type="button" data-send>${t("send")}</button>
        <button class="ghost small" type="button" data-solve>${th.status === "solved" ? t("reopen") : t("markSolved")}</button></div>`;
      const ml = body.querySelector("[data-msgs]"); ml.scrollTop = ml.scrollHeight;
      if (th.team_unread > 0) sb.rpc("admin_support_seen", { p_thread: th.id });
      body.querySelector("[data-send]").onclick = async ev => {
        const txt = body.querySelector("[data-reply]").value.trim(); if (!txt) return;
        ev.target.disabled = true;
        const { error } = await sb.rpc("admin_support_reply", { p_thread: th.id, p_body: txt });
        ev.target.disabled = false;
        if (error) return showMsg(t("failed"), "err");
        th.team_unread = 0; open();
      };
      body.querySelector("[data-solve]").onclick = async ev => {
        ev.target.disabled = true;
        const { error } = await sb.rpc("admin_support_status", { p_thread: th.id, p_solved: th.status !== "solved" });
        if (error) { ev.target.disabled = false; return showMsg(t("failed"), "err"); }
        showMsg(t("saved")); supOpenId = null; loadSupport();
      };
    };
    d.querySelector("[data-head]").onclick = () => { if (!body.hidden) { body.hidden = true; supOpenId = null; } else open(); };
    box.appendChild(d);
    if (supOpenId === th.id) open();
  }
}

// ---------- ads ----------
let adF = "pending";
async function loadAds() {
  chips("#adF", [["pending", t("fPending")], ["approved", t("fApproved")], ["rejected", t("fRejected")], ["all", t("fAll")]], adF, k => { adF = k; loadAds(); });
  const box = $("#adList");
  const { data, error } = await sb.rpc("admin_ads", { p_status: adF });
  if (error) { box.innerHTML = `<p class="hint">${esc(/function|schema cache/.test(error.message) ? t("need0015") : t("failed"))}</p>`; return; }
  const list = Array.isArray(data) ? data : [];
  if (adF === "pending") { $("#adN").hidden = !list.length; $("#adN").textContent = list.length || ""; }
  box.innerHTML = list.length ? "" : `<p class="hint">${t("nothing")}</p>`;
  for (const a of list) {
    const d = document.createElement("div"); d.className = "card";
    const img = a.image_path ? `<img src="${SUPABASE_URL}/storage/v1/object/public/venues/${esc(a.image_path)}" alt="" style="width:100%;max-height:220px;object-fit:cover;border-radius:12px;margin-bottom:8px">` : "";
    d.innerHTML = `${img}<div class="grow"><b>${esc(a.title)}</b> <span class="pill ${a.status === "approved" ? "ok" : a.status === "pending" ? "wait" : "mut"}">${esc(a.status)}</span>
      ${a.body ? `<div>${esc(a.body)}</div>` : ""}
      <div class="who">${esc(a.venue_name)} · ${esc(a.starts_on)} → ${esc(a.ends_on)}${a.status === "approved" ? " · " + esc(t("adStats", { v: a.views, t: a.taps })) : ""}</div>
      ${a.reason ? `<div class="who">${esc(a.reason)}</div>` : ""}
      <div class="acts">${a.status === "pending" ? `<button class="primary small" type="button" data-ok>${t("approve")}</button>` : ""}
      ${a.status === "pending" || a.status === "approved" ? `<button class="danger small" type="button" data-no>${a.status === "approved" ? t("takeDown") : t("rejectAd")}</button>` : ""}</div></div>`;
    const decide = async (btn, ok, reason) => {
      btn.disabled = true;
      const { error } = await sb.rpc("admin_decide_ad", { p_ad: a.id, p_approve: ok, p_reason: reason || null });
      if (error) { btn.disabled = false; return showMsg(t("failed"), "err"); }
      showMsg(t("saved")); loadAds();
    };
    d.querySelector("[data-ok]")?.addEventListener("click", ev => decide(ev.target, true));
    d.querySelector("[data-no]")?.addEventListener("click", ev => { const r = prompt(t("adWhy")); if (r !== null) decide(ev.target, false, r.trim()); });
    box.appendChild(d);
  }
}

// ---------- codes ----------
async function loadCodes() {
  const box = $("#codeList");
  const { data, error } = await sb.rpc("admin_codes", { p_kind: null, max_rows: 300 });
  if (error) { box.innerHTML = `<p class="hint">${esc(/function|schema cache/.test(error.message) ? t("need0015") : t("failed"))}</p>`; return; }
  const list = Array.isArray(data) ? data : [];
  box.innerHTML = list.length ? "" : `<p class="hint">${t("nothing")}</p>`;
  for (const c of list) {
    const d = document.createElement("div"); d.className = "card";
    d.innerHTML = `<div class="row"><div class="grow"><b class="ltr">${esc(c.code)}</b> <span class="pill ${c.void ? "bad" : c.used_at ? "mut" : "ok"}">${c.void ? t("voided") : c.used_at ? t("used") : t("unused")}</span>
      <div class="who">${esc(c.kind)} · ${c.days} d · ${esc(when(c.created_at))}${c.note ? " · " + esc(c.note) : ""}</div>
      ${c.used_at ? `<div class="who">${esc(c.used_by_name || "?")}${c.used_venue_name ? " · " + esc(c.used_venue_name) : ""} · ${esc(when(c.used_at))}</div>` : ""}</div>
      ${!c.used_at && !c.void ? `<button class="ghost small" type="button">${t("voidCode")}</button>` : ""}</div>`;
    const b = d.querySelector("button");
    if (b) b.onclick = async () => { b.disabled = true; const { error } = await sb.rpc("admin_void_code", { p_code: c.code }); if (error) { b.disabled = false; return showMsg(t("failed"), "err"); } loadCodes(); };
    box.appendChild(d);
  }
}
$("#makeCodesBtn").onclick = async () => {
  const kind = $("#codeKind").value, days = parseInt($("#codeDays").value, 10), count = parseInt($("#codeCount").value, 10);
  if (!(days > 0) || !(count > 0)) return;
  $("#makeCodesBtn").disabled = true;
  const { data, error } = await sb.rpc("admin_create_codes", { p_kind: kind, p_days: days, p_count: count, p_note: $("#codeNote").value.trim() || null });
  $("#makeCodesBtn").disabled = false;
  if (error) return showMsg(/function|schema cache/.test(error.message) ? t("need0015") : t("failed"), "err");
  const codes = (Array.isArray(data) ? data : []).map(x => typeof x === "string" ? x : Object.values(x)[0]);
  $("#newCodes").hidden = false; $("#newCodes").textContent = codes.join("\n");
  loadCodes();
};

// ---------- team ----------
async function loadTeam() {
  const { data, error } = await sb.rpc("admin_team");
  if (error) { teamOk = false; $("#setupMsg").innerHTML = `<div class="msg err">${esc(t("needSql"))}</div>`; team = []; }
  else { teamOk = true; $("#setupMsg").innerHTML = ""; team = Array.isArray(data) ? data : []; }
  render();
}
function renderTeam() {
  const box = $("#teamList"); box.innerHTML = "";
  for (const m of team) {
    const d = document.createElement("div"); d.className = "card";
    d.innerHTML = `<div class="row"><div class="grow"><b>${esc(m.name)}</b> <span class="pill ${m.role === "admin" ? "ok" : "mut"}">${t(m.role)}</span> ${m.active ? "" : `<span class="pill bad">${t("off")}</span>`}
      <div class="who ltr" style="text-align:start">${esc(m.email)}</div>
      <div class="stats"><div><div class="stat">${m.edits_today}</div><div class="who">${t("editsToday")}</div></div><div><div class="stat">${m.edits_total}</div><div class="who">${t("editsTotal")}</div></div><div><div class="stat">${m.photos_total}</div><div class="who">${t("photosTotal")}</div></div></div>
      <div class="who" style="margin-top:6px">${m.last_edit ? esc(t("lastSeen", { d: when(m.last_edit) })) : t("never")}</div>
      ${m.user_id !== me.id ? `<div class="acts"><button class="${m.active ? "danger" : "ghost"} small" type="button">${m.active ? t("switchOff") : t("switchOn")}</button></div>` : ""}
    </div></div>`;
    const btn = d.querySelector("button");
    if (btn) btn.onclick = async () => {
      btn.disabled = true;
      const { error } = await sb.rpc("admin_set_surveyor_active", { p_user: m.user_id, p_active: !m.active });
      if (error) { btn.disabled = false; return showMsg(t("failed"), "err"); }
      loadTeam();
    };
    box.appendChild(d);
  }
}
$("#addBtn").onclick = async () => {
  const email = $("#mEmail").value.trim(), name = $("#mName").value.trim();
  if (!email || !name) return;
  $("#addBtn").disabled = true;
  const { error } = await sb.rpc("admin_add_surveyor", { p_email: email, p_name: name, p_role: $("#mRole").value });
  $("#addBtn").disabled = false;
  if (error) return showMsg(/no_such_login/.test(error.message) ? t("noLogin") : /function|schema cache/.test(error.message) ? t("needSql") : t("failed"), "err");
  $("#mEmail").value = ""; $("#mName").value = ""; showMsg(t("addedOk")); loadTeam();
};

// ---------- settings ----------
$("#accOnline").onchange = async e => {
  const on = e.target.checked;
  const { error } = await sb.from("app_settings").upsert({ key: "accounts_online", value: on, updated_at: new Date().toISOString() });
  if (error) { e.target.checked = !on; return showMsg(t("failed"), "err"); }
  showMsg(t("saved"));
};
async function loadSettings() {
  const { data, error } = await sb.from("app_settings").select("key,value");
  if (error) { $("#setupMsg").innerHTML = `<div class="msg err">${esc(t("needSql"))}</div>`; return; }
  const s = Object.fromEntries((data || []).map(r => [r.key, r.value]));
  $("#accOnline").checked = s.accounts_online === true;
  $("#launchDate").value = s.launch_date || "";
  $("#gGold").value = s.gifts_per_month?.golden ?? 1; $("#gDia").value = s.gifts_per_month?.diamond ?? 3;
  showFreeEnd(s.free_plus_days ?? 90);
}
let payF = "reported";
async function loadPayments() {
  const { data: cfg } = await sb.from("app_settings").select("value").eq("key", "payments").maybeSingle();
  if (cfg?.value && document.activeElement !== $("#fibNumber") && document.activeElement !== $("#fibName")) {
    $("#fibNumber").value = cfg.value.fib_number || ""; $("#fibName").value = cfg.value.fib_name || "";
  }
  chips("#payF", [["reported", t("fWaiting")], ["paid", t("fPaid")], ["all", t("fAll")]], payF, k => { payF = k; loadPayments(); });
  const box = $("#payList");
  const { data, error } = await sb.rpc("admin_payments", { max_rows: 200 });
  if (error) { box.innerHTML = `<p class="hint">${esc(/function|schema cache|column/.test(error.message) ? t("need0012") : t("failed"))}</p>`; return; }
  const all = Array.isArray(data) ? data : [];
  const waiting = all.filter(p => p.status === "reported");
  $("#payN").hidden = !waiting.length; $("#payN").textContent = waiting.length || "";
  const paid = all.filter(p => p.status === "paid").reduce((a, p) => a + p.amount_iqd, 0);
  $("#payTotal").textContent = t("totalPaid", { n: paid.toLocaleString("en") });
  const list = payF === "all" ? all : all.filter(p => p.status === payF);
  box.innerHTML = list.length ? "" : `<p class="hint">${t("nothing")}</p>`;
  for (const p of list) {
    const d = document.createElement("div"); d.className = "card";
    const open = p.status === "reported" || p.status === "unpaid";
    d.innerHTML = `<div class="grow"><b class="ltr" style="font-size:18px">${esc(p.fib_payment_id)}</b> <span class="pill ${p.status === "paid" ? "ok" : p.status === "reported" ? "wait" : "mut"}">${t("pay_" + p.status)}</span>
      <div><b>${esc(p.display_name || "?")}</b>${p.username ? " · @" + esc(p.username) : ""}${p.phone ? ` · <a class="ltr" href="tel:${esc(p.phone)}">${esc(p.phone)}</a>` : ""}</div>
      <div class="who">${esc(t(p.tier))} · <b class="ltr">${p.amount_iqd.toLocaleString("en")} IQD</b> · ${esc(p.reported_at ? t("reportedAt", { d: when(p.reported_at) }) : t("startedAt", { d: when(p.created_at) }))}</div>
      ${p.admin_note ? `<div class="who">${esc(p.admin_note)}</div>` : ""}
      ${open ? `<div class="acts"><button class="primary small" type="button" data-ok>${t("confirmPay")}</button><button class="danger small" type="button" data-no>${t("rejectPay")}</button></div>` : ""}</div>`;
    const act = async (btn, fn, args) => {
      btn.disabled = true;
      const { error } = await sb.rpc(fn, args);
      if (error) { btn.disabled = false; return showMsg(t("failed"), "err"); }
      showMsg(t("saved")); loadPayments();
    };
    d.querySelector("[data-ok]")?.addEventListener("click", ev => {
      if (confirm(t("confirmPayAsk", { amount: p.amount_iqd.toLocaleString("en"), code: p.fib_payment_id, who: p.display_name || "?" }))) act(ev.target, "admin_confirm_payment", { p_id: p.id });
    });
    d.querySelector("[data-no]")?.addEventListener("click", ev => {
      const n = prompt(t("rejectPayAsk")); if (n !== null) act(ev.target, "admin_reject_payment", { p_id: p.id, p_note: n.trim() || null });
    });
    box.appendChild(d);
  }
}
$("#savePayWhere").onclick = async () => {
  const { data: cfg } = await sb.from("app_settings").select("value").eq("key", "payments").maybeSingle();
  const v = { ...(cfg?.value || { mode: "manual", hours: "09:00–24:00" }), fib_number: $("#fibNumber").value.trim() || null, fib_name: $("#fibName").value.trim() || null };
  saveSetting("payments", v);
};
function showFreeEnd(days) {
  const d = $("#launchDate").value;
  if (!d) { $("#freeEnd").textContent = t("notLaunched"); return; }
  const end = new Date(d + "T00:00:00"); end.setDate(end.getDate() + Number(days || 90));
  $("#freeEnd").textContent = t("freeUntil", { d: end.toLocaleDateString(lang === "ckb" ? "ckb-IQ" : "en-GB", { dateStyle: "long" }) });
}
$("#launchDate").oninput = () => showFreeEnd(90);
async function saveSetting(key, value) {
  const { error } = await sb.from("app_settings").update({ value, updated_at: new Date().toISOString() }).eq("key", key);
  showMsg(error ? t("failed") : t("saved"), error ? "err" : "ok");
}
$("#saveLaunch").onclick = () => saveSetting("launch_date", $("#launchDate").value || null);
$("#saveGifts").onclick = () => {
  const g = Math.max(0, Math.min(10, parseInt($("#gGold").value, 10) || 0)), d = Math.max(0, Math.min(10, parseInt($("#gDia").value, 10) || 0));
  saveSetting("gifts_per_month", { golden: g, diamond: d });
};

// ---------- sign in ----------
async function refreshAuth() {
  if (!sb) return show("login");
  const { data } = await sb.auth.getSession();
  me = data.session?.user || null;
  if (!me) return show("login");
  const { data: isAdmin } = await sb.rpc("is_admin");
  if (!isAdmin) { await sb.auth.signOut(); me = null; show("login"); $("#loginMsg").innerHTML = `<div class="msg err">${esc(t("notAdmin"))}</div>`; return; }
  show("app");
  await loadTeam();
  loadChanges(); countPending(); loadClaims(); loadPayments(); loadAds();
  loadSupport();
  if (!window._payTimer) window._payTimer = setInterval(() => {
    if (document.hidden) return;
    if (tab === "payments") loadPayments();
    if (tab === "support") loadSupport(true); else loadSupportCount();
  }, 30000);
}
$("#loginForm").onsubmit = async e => {
  e.preventDefault(); $("#loginMsg").innerHTML = "";
  const { error } = await sb.auth.signInWithPassword({ email: $("#email").value.trim(), password: $("#pass").value });
  if (error) { $("#loginMsg").innerHTML = `<div class="msg err">${esc(t("badLogin"))}</div>`; return; }
  refreshAuth();
};
$("#outBtn").onclick = async () => { await sb.auth.signOut(); me = null; edits = []; photos = []; team = []; show("login"); };

applyLang();
refreshAuth();
</script>
