<!doctype html>
<html lang="ckb" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>VibeCheck Survey</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;600;800&family=DM+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="leaflet.css">
<style>
:root{--coral:#E2573B;--ink:#1E1630;--bg:#F6F3F8;--card:#fff;--line:#E0D8E8;--muted:#6C6280;--ok:#1F8A5B;--err:#C0392B}
@media (prefers-color-scheme:dark){:root{--ink:#F2ECFA;--bg:#130E1E;--card:#1D1630;--line:#33294A;--muted:#A79BBD;--coral:#FF7A5C}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans Arabic","DM Sans",system-ui,sans-serif;font-size:16px;line-height:1.5}
body.en{font-family:"DM Sans","Noto Sans Arabic",system-ui,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.brand{font-family:"DM Sans",sans-serif;font-weight:800;font-size:20px;direction:ltr;display:flex;align-items:center;gap:6px}
.brand b{color:var(--coral)}
.grow{flex:1;min-width:0}
html,body{overflow-x:hidden}
.sv{font-weight:600;color:var(--muted);font-size:15px}
@media (max-width:420px){.sv{display:none}header .small{padding:6px 10px;font-size:13px;min-height:38px}}
main{max-width:560px;margin:0 auto;padding:16px 16px 120px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
h1{font-size:22px;margin:4px 0 12px}
h2{font-size:16px;margin:0 0 10px}
label{display:block;font-weight:600;margin:10px 0 6px}
.hint{color:var(--muted);font-size:13.5px;margin:2px 0 8px}
input[type=text],input[type=email],input[type=password],input[type=tel],input[type=search],textarea{width:100%;font:inherit;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink)}
textarea{min-height:70px}
input:focus,textarea:focus{outline:2px solid var(--coral);border-color:transparent}
.ltr{direction:ltr;text-align:left}
button{font:inherit;font-weight:800;border:0;border-radius:14px;padding:14px 16px;min-height:48px;cursor:pointer}
.primary{background:var(--coral);color:#fff;width:100%}
.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.small{padding:8px 12px;min-height:40px;font-size:14px}
button:disabled{opacity:.5}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 14px;font-weight:600;min-height:40px}
.chip.on{background:var(--coral);border-color:var(--coral);color:#fff}
.tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px;margin-bottom:14px}
.tabs button{background:transparent;color:var(--ink);padding:10px 4px;min-height:44px;font-size:13.5px}
.tabs button.on{background:var(--coral);color:#fff}
.loc{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pill{display:inline-block;padding:4px 10px;border-radius:999px;font-size:13px;font-weight:700}
.pill.good{background:#1F8A5B22;color:var(--ok)}.pill.bad{background:#C0392B22;color:var(--err)}.pill.wait{background:#C98A1422;color:#9a6a0e}
.photos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.slot{position:relative;aspect-ratio:1;border:2px dashed var(--line);border-radius:12px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:13px;font-weight:600;color:var(--muted);overflow:hidden;cursor:pointer;background:var(--card);padding:4px}
.slot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.slot input{position:absolute;inset:0;opacity:0;cursor:pointer;z-index:2}
.slot span::before{content:"+";display:block;font-size:26px;line-height:1;font-weight:400;margin-bottom:4px}
.picker{margin-top:12px}
.mapwrap{position:relative;height:340px;border-radius:12px;overflow:hidden;border:1px solid var(--line)}
#pickMap{position:absolute;inset:0;direction:ltr}
.crosshair{position:absolute;left:50%;top:50%;z-index:500;pointer-events:none;width:34px;height:46px;transform:translate(-50%,-100%)}
.maptools{position:absolute;top:8px;z-index:600;inset-inline-start:8px;display:flex;gap:6px}
.maptools button{background:#fff;color:#1E1630;border:1px solid #ccc;border-radius:999px;padding:6px 12px;font:inherit;font-size:13px;font-weight:700;min-height:0}
.maptools button.on{background:#1E1630;color:#fff}
.pickbtns{display:flex;gap:8px;margin-top:10px}
.pickbtns button{flex:1}
.chips button.f{padding:6px 12px;min-height:0;font-size:13.5px;font-weight:700;border-radius:999px;background:var(--card);color:var(--ink);border:1px solid var(--line)}
.chips button.f.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.popbtn{margin-top:6px;padding:6px 12px;min-height:0;font-size:13px;border-radius:999px;background:#E2573B;color:#fff}
.vdot{width:12px;height:12px;border-radius:50%;background:#6C6280;border:2px solid #fff;box-shadow:0 0 2px #0007}
.leaflet-container{font-family:"DM Sans","Noto Sans Arabic",sans-serif}

.have{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px}
.have img{width:76px;height:76px;object-fit:cover;border-radius:10px;flex:none;background:var(--line)}
.check{display:flex;gap:10px;align-items:flex-start;font-weight:600}
.check input{width:22px;height:22px;margin-top:2px;accent-color:var(--coral)}
.msg{padding:12px 14px;border-radius:12px;margin:10px 0;font-weight:600}
.msg.err{background:#C0392B1a;color:var(--err)}.msg.ok{background:#1F8A5B1a;color:var(--ok)}
.vrow{display:flex;gap:12px;align-items:center;width:100%;text-align:start;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:8px;font-weight:400;color:var(--ink);min-height:64px}
.vrow .logo{width:46px;height:46px;border-radius:12px;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;background:var(--muted);overflow:hidden}
.vrow .logo img{width:100%;height:100%;object-fit:cover}
.vrow b{display:block;font-size:15.5px}
.vrow small{color:var(--muted)}
.stat{font-size:26px;font-weight:800}
.bar{position:fixed;bottom:0;left:0;right:0;background:var(--bg);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
.bar>div{max-width:560px;margin:0 auto;display:flex;gap:8px}
.bar .primary{flex:1}
.progress{height:6px;border-radius:6px;background:var(--line);overflow:hidden;margin-top:8px}
.progress i{display:block;height:100%;background:var(--coral);width:0}
[hidden]{display:none!important}
</style>
</head>
<body>
<header>
  <div class="brand"><svg width="22" height="22" viewBox="0 0 100 100" aria-hidden="true"><path d="M20 50 40 70 66 37" fill="none" stroke="currentColor" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/><circle cx="78" cy="23" r="10" fill="#E2573B"/></svg><span>Vibe<b>Check</b></span> <span class="sv">Survey</span></div>
  <div class="grow"></div>
  <button class="ghost small" id="langBtn" type="button">English</button>
  <button class="ghost small" id="outBtn" type="button" hidden data-t="logout"></button>
</header>

<main>
  <section id="login" hidden>
    <h1 data-t="loginTitle"></h1>
    <div class="card">
      <form id="loginForm">
        <label for="email" data-t="email"></label>
        <input id="email" type="email" class="ltr" autocomplete="username" required>
        <label for="pass" data-t="password"></label>
        <input id="pass" type="password" class="ltr" autocomplete="current-password" required>
        <div id="loginMsg"></div>
        <button class="primary" type="submit" style="margin-top:14px" data-t="signIn"></button>
      </form>
    </div>
  </section>

  <section id="home" hidden>
    <div class="card" style="display:flex;align-items:center;gap:16px">
      <div><div class="stat" id="todayCount">0</div><div class="hint" style="margin:0" data-t="todayChanges"></div></div>
      <div class="grow"></div>
      <div class="hint" id="who" style="margin:0"></div>
    </div>
    <div class="tabs" role="tablist">
      <button type="button" data-tab="all" class="on" data-t="tabAll"></button>
      <button type="button" data-tab="map" data-t="tabMap"></button>
      <button type="button" data-tab="latest" data-t="tabLatest"></button>
      <button type="button" data-tab="new" data-t="tabNew"></button>
    </div>
    <div id="allBox">
      <input id="q" type="search" data-ph="searchPh" style="margin-bottom:10px">
      <div class="chips" id="catF" style="margin-bottom:10px"></div>
      <div class="loc" style="margin-bottom:10px"><span id="allCount" class="hint" style="margin:0"></span><span class="grow"></span><button class="ghost small" type="button" id="nearBtn" data-t="sortNear"></button><span id="nearState" class="pill wait" hidden></span></div>
      <div id="allList"></div>
      <button class="ghost" type="button" id="moreBtn" style="width:100%" data-t="showMore" hidden></button>
    </div>
    <div id="mapBox" hidden>
      <div class="mapwrap" style="height:70vh">
        <div id="allMap" style="position:absolute;inset:0;direction:ltr"></div>
        <div class="maptools"><button type="button" id="aLayMap" class="on" data-t="layMap"></button><button type="button" id="aLaySat" data-t="laySat"></button></div>
      </div>
      <p class="hint" style="margin-top:8px" data-t="mapLegend"></p>
    </div>
    <div id="latestBox" hidden>
      <p class="hint" data-t="latestHint"></p>
      <div id="latestList"></div>
    </div>
    <div id="homeMsg"></div>
  </section>

  <section id="edit" hidden>
    <button class="ghost small" type="button" id="backBtn" style="margin-bottom:10px" data-t="back"></button>
    <h1 id="editTitle"></h1>
    <form id="form" novalidate onsubmit="return false">
      <div class="card">
        <h2 data-t="location"></h2>
        <p class="hint" id="locHint"></p>
        <div class="loc">
          <button class="ghost small" type="button" id="locBtn" data-t="useMyLoc"></button>
          <span id="locState" class="pill wait" hidden></span>
          <button class="ghost small" type="button" id="pickBtn" data-t="pickOnMap"></button>
          <a id="locMap" class="hint" target="_blank" rel="noopener" data-t="checkMap"></a>
        </div>
        <div class="picker" id="picker" hidden>
          <p class="hint" data-t="pickHint"></p>
          <div class="mapwrap">
            <div id="pickMap"></div>
            <svg class="crosshair" viewBox="0 0 34 46" aria-hidden="true"><path d="M17 45C17 45 2 27 2 16a15 15 0 0 1 30 0c0 11-15 29-15 29z" fill="#E2573B" stroke="#fff" stroke-width="2.5"/><circle cx="17" cy="16" r="5.5" fill="#fff"/></svg>
            <div class="maptools"><button type="button" id="layMap" class="on" data-t="layMap"></button><button type="button" id="laySat" data-t="laySat"></button></div>
          </div>
          <div class="pickbtns"><button type="button" class="primary" id="pickOk" data-t="pickOk"></button><button type="button" class="ghost" id="pickCancel" data-t="cancel"></button></div>
        </div>
      </div>
      <div class="card">
        <h2 data-t="names"></h2>
        <label for="nOrig" data-t="nameOrig"></label>
        <input id="nOrig" type="text" maxlength="120" required>
        <label for="nCkb" data-t="nameCkb"></label>
        <input id="nCkb" type="text" maxlength="120" dir="rtl">
        <label for="nAr" data-t="nameAr"></label>
        <input id="nAr" type="text" maxlength="120" dir="rtl">
        <label for="nEn" data-t="nameEn"></label>
        <input id="nEn" type="text" maxlength="120" class="ltr">
      </div>
      <div class="card">
        <h2 data-t="type"></h2>
        <div class="chips" id="cats"></div>
      </div>
      <div class="card">
        <h2 data-t="photos"></h2>
        <div class="have" id="have"></div>
        <p class="hint" data-t="photoHint"></p>
        <div class="photos">
          <div class="slot"><span data-t="pFront"></span><input type="file" accept="image/*" data-slot="front"></div>
          <div class="slot"><span data-t="pInside"></span><input type="file" accept="image/*" data-slot="inside"></div>
          <div class="slot"><span data-t="pTable"></span><input type="file" accept="image/*" data-slot="table"></div>
          <div class="slot"><span data-t="pMenu"></span><input type="file" accept="image/*" data-slot="menu"></div>
          <div class="slot"><span data-t="pMore"></span><input type="file" accept="image/*" multiple data-slot="other"></div>
          <div class="slot" id="logoSlot"><span data-t="pLogo"></span><input type="file" accept="image/*" data-slot="logo"></div>
        </div>
        <label class="check" style="margin-top:14px"><input type="checkbox" id="consent"><span data-t="consent"></span></label>
      </div>
      <div class="card">
        <h2 data-t="details"></h2>
        <label for="phone" data-t="phone"></label>
        <input id="phone" type="tel" class="ltr" maxlength="30" placeholder="0770 123 4567">
        <label for="ig">Instagram</label>
        <input id="ig" type="text" class="ltr" maxlength="80" placeholder="@name">
        <label for="hours" data-t="hours"></label>
        <input id="hours" type="text" maxlength="120" data-ph="hoursPh">
      </div>
      <div id="formMsg"></div>
    </form>
  </section>
</main>

<div class="bar" id="bar" hidden><div style="flex-direction:column">
  <button class="primary" id="saveBtn" type="button" data-t="save"></button>
  <div class="progress" id="prog" hidden><i></i></div>
</div></div>

function dist(a, b) {
  const r = 6371000, p1 = a.lat * Math.PI / 180, p2 = b.lat * Math.PI / 180, dp = p2 - p1, dl = (b.lng - a.lng) * Math.PI / 180;
  const h = Math.sin(dp / 2) ** 2 + Math.cos(p1) * Math.cos(p2) * Math.sin(dl / 2) ** 2;
  return 2 * r * Math.asin(Math.min(1, Math.sqrt(h)));
}
const fmtD = m => m < 1000 ? `${Math.round(m / 10) * 10} ${lang === "ckb" ? "م" : "m"}` : `${(m / 1000).toFixed(1)} ${lang === "ckb" ? "کم" : "km"}`;
const catLabel = c => (CATS.find(x => x[0] === c) || [, "", ""])[lang === "ckb" ? 1 : 2];

const norm = s => String(s || "").toLowerCase().replace(/ي/g, "ی").replace(/ك/g, "ک").replace(/ة/g, "ە").replace(/[ً-ْ]/g, "").trim();
function filtered() {
  const q = norm($("#q").value);
  const list = all.filter(v => (!catF || (catF === "nophoto" ? !photoCounts[v.id] && !v.logo_path : v.category === catF))
    && (!q || [v.name, v.name_en, v.name_ckb, v.name_ar].some(n => n && norm(n).includes(q))));
  if (here) list.sort((a, b) => dist(here, a) - dist(here, b)); else list.sort((a, b) => a.name.localeCompare(b.name));
  return list;
}
function latest() {
  return all.filter(v => new Date(v.updated_at) - new Date(v.created_at) > 60000 || new Date(v.created_at) > new Date("2026-10-22T15:00:00Z"))
    .sort((a, b) => (b.updated_at > a.updated_at ? 1 : -1)).slice(0, 40);
}
function renderFilters() {
  const box = $("#catF"); box.innerHTML = "";
  const opts = [[null, t("fAll")], ["nophoto", t("fNoPhoto")], ...CATS.filter(c => all.some(v => v.category === c[0])).map(c => [c[0], catLabel(c[0])])];
  for (const [k, label] of opts) {
    const b = document.createElement("button"); b.type = "button"; b.className = "f" + (catF === k ? " on" : ""); b.textContent = label;
    b.onclick = () => { catF = k; shown = 60; render(); }; box.appendChild(b);

}
function render() {

  else if (here) { st.hidden = false; st.className = "pill " + (here.accuracy <= 30 ? "good" : "wait"); st.textContent = t("accuracy", { m: Math.round(here.accuracy) }); }
  else st.hidden = true;
  renderEditLoc(); renderCats();
}

function renderList(sel, list, emptyText, showTime) {
  const box = $(sel); box.innerHTML = "";
  if (!list.length) { if (emptyText) box.innerHTML = `<p class="hint">${esc(emptyText)}</p>`; return; }
  for (const v of list) {
    const b = document.createElement("button"); b.type = "button"; b.className = "vrow";
    const alt = [v.name_en, v.name_ckb, v.name_ar].filter(x => x && x !== v.name)[0];
    const d = here ? " · " + fmtD(dist(here, v)) : "";
    const pic = v.logo_path || firstPhoto[v.id];
    const logo = pic ? `<img alt="" loading="lazy" src="${esc(publicUrl(pic))}">` : esc((v.name || "?").slice(0, 2).toUpperCase());
    const when = showTime && v.updated_at ? `<br><small>${esc(t("editedAt", { d: new Date(v.updated_at).toLocaleString(lang === "ckb" ? "ckb-IQ" : "en-GB", { dateStyle: "short", timeStyle: "short" }) }))}</small>` : "";
    b.innerHTML = `<span class="logo">${logo}</span><span class="grow"><b>${esc(v.name)}</b>${alt ? `<small>${esc(alt)}</small><br>` : ""}<small>${esc(catLabel(v.category))}${d} · ${esc(t("photosN", { n: photoCounts[v.id] || 0 }))}</small>${when}</span>`;
    b.onclick = () => openEdit(v);
    box.appendChild(b);
  }
}
const COLS = "id,name,name_ckb,name_ar,name_en,category,lat,lng,phone,instagram,opening_hours,logo_path,created_at,updated_at";
const firstPhoto = {};
// Every place in the database (about 1,400), loaded once and then kept up to date.
async function loadAll() {
  const rows = [];
  for (let from = 0; ; from += 1000) {
    const { data, error } = await sb.from("venues").select(COLS).eq("hidden", false).order("id").range(from, from + 999);
    if (error) return showMsg("#homeMsg", t("failed"), "err");
    if (!Array.isArray(data)) break;
    rows.push(...data); if (data.length < 1000) break;
  }
  all = rows; allById = Object.fromEntries(rows.map(v => [v.id, v]));
  rows.forEach(v => { if (v.updated_at > lastSync) lastSync = v.updated_at; });
  await loadPhotos(); render(); drawAllMap();
}
async function loadPhotos() {
  const { data } = await sb.from("venue_photos").select("venue_id,path").order("created_at", { ascending: false }).limit(20000);
  if (!data) return;
  for (const k in firstPhoto) delete firstPhoto[k];
  photoCounts = {};
  data.forEach(r => { photoCounts[r.venue_id] = (photoCounts[r.venue_id] || 0) + 1; if (!firstPhoto[r.venue_id]) firstPhoto[r.venue_id] = r.path; });
}
function putVenue(v) {
  if (v.hidden) delete allById[v.id]; else allById[v.id] = v;
  if (v.updated_at > lastSync) lastSync = v.updated_at;
  all = Object.values(allById);
}
async function syncChanges() {
  const { data } = await sb.from("venues").select(COLS + ",hidden").gt("updated_at", lastSync).order("updated_at").limit(500);
  (data || []).forEach(putVenue);
  await loadPhotos(); render(); drawAllMap();
}
// The team's changes appear on everyone's page within 20 seconds.
setInterval(() => { if (me && all.length && view === "home" && !document.hidden) syncChanges(); }, 20000);
document.addEventListener("visibilitychange", () => { if (!document.hidden && me && all.length) syncChanges(); });

// ---------- map of every place ----------
let amap = null, aMapT = null, aSatT = null, aDots = null, meDot = null;
function showAllMap() {
  if (typeof L === "undefined") return;
  if (!amap) {
    amap = L.map("allMap", { preferCanvas: true, maxZoom: 20 });
    aMapT = L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 20, maxNativeZoom: 19, attribution: "© OpenStreetMap" }).addTo(amap);
    aSatT = L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", { maxZoom: 20, maxNativeZoom: 19, attribution: "Imagery © Esri" });
    aDots = L.layerGroup().addTo(amap);
    const c = here || { lat: 35.5617, lng: 45.4329 };
    amap.setView([c.lat, c.lng], here ? 16 : 13);
    drawAllMap();
  }
  setTimeout(() => amap.invalidateSize(), 50);
}
function drawAllMap() {
  if (!amap) return;
  aDots.clearLayers();
  for (const v of all) {
    const has = photoCounts[v.id] || v.logo_path;
    const m = L.circleMarker([v.lat, v.lng], { radius: 7, weight: 2, color: "#fff", fillColor: has ? "#E2573B" : "#6C6280", fillOpacity: 1 });
    m.bindPopup(() => {
      const d = document.createElement("div");
      d.innerHTML = `<b>${esc(v.name)}</b><br><small>${esc(catLabel(v.category))} · ${esc(t("photosN", { n: photoCounts[v.id] || 0 }))}</small><br>`;
      const b = document.createElement("button"); b.type = "button"; b.className = "popbtn"; b.textContent = t("editBtn");
      b.onclick = () => { amap.closePopup(); openEdit(allById[v.id] || v); };
      d.appendChild(b); return d;
    });
    m.addTo(aDots);
  }
  if (here) { meDot && meDot.remove(); meDot = L.circleMarker([here.lat, here.lng], { radius: 8, weight: 3, color: "#fff", fillColor: "#2D7FF9", fillOpacity: 1 }).addTo(amap); }
}
$("#aLayMap").onclick = () => { if (!amap) return; amap.removeLayer(aSatT); aMapT.addTo(amap); $("#aLayMap").classList.add("on"); $("#aLaySat").classList.remove("on"); };
$("#aLaySat").onclick = () => { if (!amap) return; amap.removeLayer(aMapT); aSatT.addTo(amap); $("#aLaySat").classList.add("on"); $("#aLayMap").classList.remove("on"); };

function locate(cb) {
  if (!navigator.geolocation) return showMsg(view === "edit" ? "#formMsg" : "#homeMsg", t("locDenied"), "err");
  if (watchId !== null) navigator.geolocation.clearWatch(watchId);
  let best = null;
  watchId = navigator.geolocation.watchPosition(p => {
    const c = p.coords;
    if (!best || c.accuracy <= best.accuracy) best = { lat: c.latitude, lng: c.longitude, accuracy: c.accuracy };
    cb(best, false);
    if (best.accuracy <= 15) { navigator.geolocation.clearWatch(watchId); watchId = null; cb(best, true); }
  }, () => { watchId = null; render(); showMsg(view === "edit" ? "#formMsg" : "#homeMsg", t("locDenied"), "err"); }, { enableHighAccuracy: true, maximumAge: 0, timeout: 30000 });
  render();
}
$("#nearBtn").onclick = () => locate((p, final) => { here = p; render(); if (final) drawAllMap(); });

// ---------- edit / new ----------
async function openEdit(v) {
  if (v) { const { data } = await sb.from("venues").select(COLS).eq("id", v.id).maybeSingle(); if (data) v = data; }
  cur = v; cat = v ? v.category : null; pos = null; closePicker();
  for (const k in files) delete files[k];
  document.querySelectorAll(".slot img").forEach(i => i.remove());
  $("#form").reset(); showMsg("#formMsg", "");
  $("#editTitle").textContent = v ? v.name : t("newTitle");
  $("#nOrig").value = v?.name || ""; $("#nCkb").value = v?.name_ckb || ""; $("#nAr").value = v?.name_ar || ""; $("#nEn").value = v?.name_en || "";
  $("#phone").value = v?.phone || ""; $("#ig").value = v?.instagram || ""; $("#hours").value = v?.opening_hours || "";
  const have = $("#have"); have.innerHTML = "";
  if (v) {
    if (v.logo_path) have.insertAdjacentHTML("beforeend", `<img alt="" src="${esc(publicUrl(v.logo_path))}">`);
    const { data } = await sb.from("venue_photos").select("path").eq("venue_id", v.id).order("created_at", { ascending: false }).limit(20);
    (data || []).forEach(p => have.insertAdjacentHTML("beforeend", `<img alt="" src="${esc(publicUrl(p.path))}">`));
  }
  show("edit"); render();
  if (!v && here && here.accuracy <= 30) pos = here;
  renderEditLoc();
}
$("#backBtn").onclick = () => { show("home"); render(); if (tab === "map") showAllMap(); syncChanges(); };
function renderEditLoc() {
  if (view !== "edit") return;
  $("#locHint").textContent = cur ? t("locHintEdit") : t("locHintNew");
  const st = $("#locState"), map = $("#locMap");
  const p = pos || (cur ? { lat: cur.lat, lng: cur.lng } : null);
  map.hidden = !p; if (p) map.href = `https://www.google.com/maps/search/?api=1&query=${p.lat},${p.lng}`;
  if (pos && pos.manual) { st.hidden = false; st.className = "pill good"; st.textContent = t("pickedOnMap"); }
  else if (pos) { st.hidden = false; st.className = "pill " + (pos.accuracy <= 25 ? "good" : pos.accuracy <= 50 ? "wait" : "bad"); st.textContent = t("accuracy", { m: Math.round(pos.accuracy) }); }
  else if (watchId !== null) { st.hidden = false; st.className = "pill wait"; st.textContent = t("locating"); }
  else st.hidden = true;
}
$("#locBtn").onclick = () => { closePicker(); locate(p => { pos = p; here = here || p; renderEditLoc(); }); };

// ---------- pick on map ----------
let map = null, tileMap = null, tileSat = null, dots = null, dotTimer = null;
const CITY = { lat: 35.5617, lng: 45.4329 };
function openPicker() {
  if (typeof L === "undefined") return;
  if (watchId !== null) { navigator.geolocation.clearWatch(watchId); watchId = null; }
  $("#picker").hidden = false;
  const start = pos || (cur ? { lat: cur.lat, lng: cur.lng } : null) || here || CITY;
  const z = (pos || cur) ? 19 : here ? 17 : 13;
  if (!map) {
    map = L.map("pickMap", { zoomControl: true, attributionControl: true, maxZoom: 20 });
    tileMap = L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 20, maxNativeZoom: 19, attribution: "© OpenStreetMap" });
    tileSat = L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", { maxZoom: 20, maxNativeZoom: 19, attribution: "Imagery © Esri" });
    tileMap.addTo(map);
    dots = L.layerGroup().addTo(map);
    map.on("moveend", () => { clearTimeout(dotTimer); dotTimer = setTimeout(loadDots, 250); });
  }
  map.setView([start.lat, start.lng], z);
  setTimeout(() => { map.invalidateSize(); loadDots(); }, 50);
  $("#picker").scrollIntoView({ behavior: "smooth", block: "center" });
}
function setLayer(sat) {
  if (!map) return;
  if (sat) { map.removeLayer(tileMap); tileSat.addTo(map); } else { map.removeLayer(tileSat); tileMap.addTo(map); }
  $("#layMap").classList.toggle("on", !sat); $("#laySat").classList.toggle("on", sat);
}
async function loadDots() {
  if (!map || $("#picker").hidden || map.getZoom() < 15) { dots && dots.clearLayers(); return; }
  const b = map.getBounds();
  const { data } = await sb.from("venues").select("id,name,lat,lng")
    .gte("lat", b.getSouth()).lte("lat", b.getNorth()).gte("lng", b.getWest()).lte("lng", b.getEast()).limit(300);
  dots.clearLayers();
  (data || []).forEach(v => {
    if (cur && v.id === cur.id) return;
    L.marker([v.lat, v.lng], { icon: L.divIcon({ className: "", html: '<div class="vdot"></div>', iconSize: [12, 12] }) })
      .bindTooltip(esc(v.name), { direction: "top" }).addTo(dots);
  });
}
function closePicker() { $("#picker").hidden = true; }
$("#pickBtn").onclick = openPicker;
$("#layMap").onclick = () => setLayer(false);
$("#laySat").onclick = () => setLayer(true);
$("#pickCancel").onclick = closePicker;
$("#pickOk").onclick = () => {
  const c = map.getCenter();
  pos = { lat: +c.lat.toFixed(7), lng: +c.lng.toFixed(7), accuracy: 0, manual: true };
  closePicker(); renderEditLoc();
};
function renderCats() {
  const box = $("#cats"); box.innerHTML = "";
  for (const [k] of CATS) {
    const b = document.createElement("button");
    b.type = "button"; b.className = "chip" + (cat === k ? " on" : ""); b.textContent = catLabel(k); b.setAttribute("aria-pressed", cat === k);
    b.onclick = () => { cat = k; renderCats(); };
    box.appendChild(b);
  }
}
document.querySelectorAll(".slot input").forEach(inp => {
  inp.onchange = () => {
    const f = inp.files && inp.files[0]; if (!f) return;
    files[inp.dataset.slot] = inp.dataset.slot === "other" ? [...inp.files] : f;
    const slot = inp.parentElement; slot.querySelector("img")?.remove();
    const img = document.createElement("img"); img.alt = ""; img.src = URL.createObjectURL(f); slot.insertBefore(img, inp);
  };
});

async function shrink(file, max = 1600, type = "image/jpeg", q = 0.82) {
  try {
    const bmp = await createImageBitmap(file, { imageOrientation: "from-image" });
    const s = Math.min(1, max / Math.max(bmp.width, bmp.height));
    const c = document.createElement("canvas"); c.width = Math.round(bmp.width * s); c.height = Math.round(bmp.height * s);
    c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
    return await new Promise(r => c.toBlob(b => r(b || file), type, q));
  } catch { return file; }
}

let saving = false;
$("#saveBtn").onclick = async () => {
  if (saving) return;
  showMsg("#formMsg", "");
  const name = $("#nOrig").value.trim();
  const photoSlots = ["front", "inside", "table", "menu", "other"].filter(k => files[k]);
  if (!cur && (!pos || pos.accuracy > 50)) return fail("needLoc");
  if (pos && pos.accuracy > 50) return fail("needLoc");
  if (!name) return fail("needName");
  if (!cat) return fail("needCat");
  if ((photoSlots.length || files.logo) && !$("#consent").checked) return fail("needConsent");
  saving = true; $("#saveBtn").disabled = true; $("#saveBtn").textContent = t("sending");
  const prog = $("#prog"); prog.hidden = false; const bar = prog.querySelector("i");
  try {
    const v = id => $(id).value.trim() || null;
    const fields = { name, name_ckb: v("#nCkb"), name_ar: v("#nAr"), name_en: v("#nEn"), category: cat, phone: v("#phone"), instagram: v("#ig"), opening_hours: v("#hours") };
    if (pos) { fields.lat = pos.lat; fields.lng = pos.lng; }
    let venue;
    if (cur) {
      const { data, error } = await sb.from("venues").update(fields).eq("id", cur.id).select(COLS).single();
      if (error) throw error; venue = data;
    } else {
      const { data, error } = await sb.from("venues").insert({ ...fields, source: "own", added_by: me.id, status: "approved" }).select(COLS).single();
      if (error) throw error; venue = data;
    }
    const total = photoSlots.length + (files.logo ? 1 : 0) + 1; let done = 1;
    bar.style.width = `${Math.round(done / total * 100)}%`;
    const stamp = Date.now();
    if (files.logo) {
      const isPng = files.logo.type === "image/png";
      const blob = await shrink(files.logo, 800, isPng ? "image/png" : "image/jpeg");
      const path = `${venue.id}/logo-${stamp}.${blob.type === "image/png" ? "png" : "jpg"}`;
      const up = await sb.storage.from("venues").upload(path, blob, { contentType: blob.type });
      if (up.error) throw up.error;
      const { data, error } = await sb.from("venues").update({ logo_path: path }).eq("id", venue.id).select(COLS).single();
      if (error) throw error; venue = data;
      bar.style.width = `${Math.round(++done / total * 100)}%`;
    }
    for (const k of photoSlots) {
      const list = Array.isArray(files[k]) ? files[k] : [files[k]];
      for (let i = 0; i < list.length; i++) {
        const blob = await shrink(list[i]);
        const path = `${venue.id}/${stamp}-${k}${i ? "-" + i : ""}.jpg`;
        const up = await sb.storage.from("venues").upload(path, blob, { contentType: blob.type });
        if (up.error) throw up.error;
        const { error } = await sb.from("venue_photos").insert({ venue_id: venue.id, path, kind: k, owner_consent: true, added_by: me.id });
        if (error) throw error;
        photoCounts[venue.id] = (photoCounts[venue.id] || 0) + 1;
      }
      bar.style.width = `${Math.round(++done / total * 100)}%`;
    }
    putVenue(venue); await loadPhotos(); drawAllMap();
    loadToday();
    show("home"); render(); if (tab === "map") showAllMap(); showMsg("#homeMsg", t("saved"), "ok");
  } catch (e) {
    console.error(e);
    showMsg("#formMsg", /row-level security|admin_only/.test(String(e?.message)) ? t("notSurveyor") : t("failed"), "err");
  } finally {
    saving = false; $("#saveBtn").disabled = false; $("#saveBtn").textContent = t("save"); setTimeout(() => { prog.hidden = true; bar.style.width = "0"; }, 600);
  }
};
function fail(k) { showMsg("#formMsg", t(k), "err"); $("#formMsg").scrollIntoView({ behavior: "smooth", block: "center" }); }

// ---------- auth ----------
async function loadToday() {
  const start = new Date(); start.setHours(0, 0, 0, 0);
  const { count } = await sb.from("venue_edits").select("id", { count: "exact", head: true }).eq("editor_id", me.id).gte("created_at", start.toISOString());
  $("#todayCount").textContent = count || 0;
}
async function refreshAuth() {
  if (!sb) return;
  const { data } = await sb.auth.getSession();
  me = data.session?.user || null;
  if (!me) return show("login");
  $("#who").textContent = me.email;
  if (view === "login") show("home");
  render(); loadToday();
  if (!all.length) loadAll();
  if (!here) $("#nearBtn").click();
}
$("#loginForm").onsubmit = async e => {
  e.preventDefault(); showMsg("#loginMsg", "");
  const { error } = await sb.auth.signInWithPassword({ email: $("#email").value.trim(), password: $("#pass").value });
  if (error) return showMsg("#loginMsg", t("badLogin"), "err");
  view = "login"; refreshAuth();
};
$("#outBtn").onclick = async () => { await sb.auth.signOut(); me = null; show("login"); };

view = "login";
applyLang();
if (sb) refreshAuth(); else show("login");
</script>
</body>
</html>
